# Plantilla de referencia. Ajustar dominio, certificados, CSP y rutas por entorno.
server {
    listen 80;
    server_name siga.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name siga.example.com;

    ssl_certificate     /etc/letsencrypt/live/siga.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siga.example.com/privkey.pem;

    # Baseline alineado con Evidence Service. Debe ser >= al máximo permitido por app.
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
