name: backend-ci
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        run: ./mvnw -B clean verify
      - name: Publish test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
      # Agregar SonarCloud/CodeQL/Gitleaks/Dependency-Check según secrets y política del repo.

  image:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable image
        run: docker build -t "$IMAGE:${GITHUB_SHA}" .
      # Autenticación recomendada en GCP: Workload Identity Federation / OIDC.
      # Ejecutar Trivy antes de promover; publicar en Artifact Registry si el quality gate pasa.
