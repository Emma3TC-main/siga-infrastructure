name: frontend-ci
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --coverage
      - run: npm run build
      # Playwright se ejecuta contra QA o un stack efímero cuando el flujo lo justifique.
