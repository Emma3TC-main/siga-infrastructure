# Baseline orientativa para integración local/DEV.
# En el esquema multirepo, las imágenes pueden construirse en cada repo y publicarse
# en Artifact Registry. Esta plantilla evita acoplar el código fuente de todos los repos.
name: siga
services:
  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.example.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    depends_on: [web, api-gateway]

  web:
    image: ${AR_HOST:-local}/siga-web:${SIGA_VERSION:-dev}
    networks: [edge]

  api-gateway:
    image: ${AR_HOST:-local}/siga-api-gateway:${SIGA_VERSION:-dev}
    env_file: [.env]
    networks: [edge, backend]
    depends_on: [identity-service, catalog-service, inventory-service, evidence-service, audit-notification-service, reporting-analytics-service]

  identity-service:
    image: ${AR_HOST:-local}/siga-identity-service:${SIGA_VERSION:-dev}
    env_file: [.env]
    networks: [backend, data, observability]
    depends_on: [postgres, redis]

  catalog-service:
    image: ${AR_HOST:-local}/siga-catalog-service:${SIGA_VERSION:-dev}
    env_file: [.env]
    networks: [backend, data, observability]
    depends_on: [postgres, redis, rabbitmq]

  inventory-service:
    image: ${AR_HOST:-local}/siga-inventory-service:${SIGA_VERSION:-dev}
    env_file: [.env]
    networks: [backend, data, observability]
    depends_on: [postgres, rabbitmq]

  evidence-service:
    image: ${AR_HOST:-local}/siga-evidence-service:${SIGA_VERSION:-dev}
    env_file: [.env]
    networks: [backend, data, observability]
    depends_on: [postgres, minio, rabbitmq]

  audit-notification-service:
    image: ${AR_HOST:-local}/siga-audit-notification-service:${SIGA_VERSION:-dev}
    env_file: [.env]
    networks: [backend, data, observability]
    depends_on: [postgres, rabbitmq]

  reporting-analytics-service:
    image: ${AR_HOST:-local}/siga-reporting-analytics-service:${SIGA_VERSION:-dev}
    env_file: [.env]
    networks: [backend, data, observability]
    depends_on: [postgres, redis, rabbitmq]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: siga
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    # No publicar 5432 en entorno compartido. Para local, habilitar temporalmente si se requiere.

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    networks: [data]

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [backend, data]
    # Management UI no debe publicarse en producción.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes: [minio-data:/data]
    networks: [data]

  prometheus:
    image: prom/prometheus:latest
    networks: [observability, backend]

  grafana:
    image: grafana/grafana:latest
    networks: [observability]
    depends_on: [prometheus, loki]

  loki:
    image: grafana/loki:latest
    networks: [observability]

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["dev-observability"]
    networks: [observability]

networks:
  edge: {}
  backend: {}
  data: {}
  observability: {}
volumes:
  postgres-data: {}
  rabbitmq-data: {}
  minio-data: {}
